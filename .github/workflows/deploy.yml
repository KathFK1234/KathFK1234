name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every three hours: redraw the "On GitHub" card, and pick up languages and
    # tools from new or changed repositories, anything new in MoodForecast AI
    # for the terminal's mood command, and the latest work on each project
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Rewrites the marked README sections and src/data/stack.json.
      # If GitHub's API is unavailable the site still deploys with the last known data.
      - name: Detect languages and tools across my repositories
        id: detect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional secret: a token that can read private repositories
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          pip install --quiet requests
          if [ -n "$STACK_TOKEN" ]; then
            GITHUB_TOKEN="$STACK_TOKEN" python3 languages_update_script.py --username "$OWNER" --include-private
          else
            python3 languages_update_script.py --username "$OWNER"
          fi

      # Draws public/activity.svg, the "On GitHub" card in the README. It is
      # published with the site and never committed, so it is redrawn on every
      # run, pushes included, and the README always shows the newest one.
      - name: Draw the activity card
        id: activity
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.STACK_TOKEN || github.token }}
          OWNER: ${{ github.repository_owner }}
        run: python3 activity_card_script.py --username "$OWNER"

      # Rewrites src/data/mood.json (the endpoints, places and activities the
      # terminal's mood command knows about) and the endpoint list in the
      # terminal's notes on the project.
      - name: Sync the mood command with MoodForecast AI
        id: mood
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 mood_sync_script.py

      # Rewrites src/data/projects.json, each project's CHANGELOG.md in the
      # terminal, and the README's "Lately" table and source links. Runs after
      # the languages step, which rewrites other parts of the same README.
      - name: Pick up the latest work on each project
        id: projects
        continue-on-error: true
        env:
          # Private projects need the optional secret; without it they keep their last data
          GITHUB_TOKEN: ${{ secrets.STACK_TOKEN || github.token }}
        run: python3 projects_sync_script.py

      # The dated lists above update themselves. The hand-written pages do not,
      # so say which ones their projects have moved on from.
      - name: Say which project write-ups are behind
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.STACK_TOKEN || github.token }}
        run: |
          behind="$(python3 projects_sync_script.py --check --quiet)"
          if [ -n "$behind" ]; then
            echo "$behind"
            echo "::notice title=Project write-ups to revise::${behind//$'\n'/%0A}"
          fi

      # Without this the failure above is silent and the README quietly goes stale.
      - name: Warn if detection failed
        if: steps.detect.outcome == 'failure'
        run: |
          echo "::warning title=Languages and tools were not updated::The detection step failed, so the README and site kept their last data. If STACK_TOKEN is set, check that it has not expired."
          git checkout -- README.md src/data/stack.json

      - name: Warn if the activity card failed
        if: steps.activity.outcome == 'failure'
        run: |
          echo "::warning title=Activity card was not updated::The card kept its last data. If STACK_TOKEN is set, check that it has not expired."
          # Publish the card that is live now, so the README's image does not break
          curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/activity.svg" -o public/activity.svg || true

      - name: Warn if the mood sync failed
        if: steps.mood.outcome == 'failure'
        run: |
          echo "::warning title=The mood command was not updated::MoodForecast AI or GitHub did not answer, so the terminal kept the endpoints, places and activities it already knew."
          git checkout -- src/data/mood.json content/home/projects/moodforecast-ai/API.md

      # It writes nothing unless every file can be written, so there is nothing to put back.
      - name: Warn if the project sync failed
        if: steps.projects.outcome == 'failure'
        run: echo "::warning title=Project updates were not refreshed::GitHub did not answer, so the changelogs and the Lately table kept their last data."

      # Not on pushes: a push changes this repo's own totals, and committing back
      # every time would leave the local clone permanently one commit behind.
      - name: Commit the update if anything changed
        if: github.event_name != 'push'
        run: |
          git config user.name "Katheu Kilonzo"
          git config user.email "fkatheukilonzo@gmail.com"
          git add README.md src/data/stack.json src/data/mood.json src/data/projects.json content/home/projects/moodforecast-ai/API.md content/home/projects/*/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update languages, tools, the mood command and project updates"
            # main may have moved while this ran
            git pull --rebase
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
