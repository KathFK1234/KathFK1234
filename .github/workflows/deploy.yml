name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Once a day, pick up languages and tools from new or changed repositories
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Rewrites the marked README sections and src/data/stack.json.
      # If GitHub's API is unavailable the site still deploys with the last known data.
      - name: Detect languages and tools across my repositories
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional secret: a token that can read private repositories
          STACK_TOKEN: ${{ secrets.STACK_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          pip install --quiet requests
          if [ -n "$STACK_TOKEN" ]; then
            GITHUB_TOKEN="$STACK_TOKEN" python3 languages_update_script.py --username "$OWNER" --include-private
          else
            python3 languages_update_script.py --username "$OWNER"
          fi

      # Not on pushes: a push changes this repo's own totals, and committing back
      # every time would leave the local clone permanently one commit behind.
      - name: Commit the update if anything changed
        if: github.event_name != 'push'
        run: |
          git config user.name "Katheu Kilonzo"
          git config user.email "fkatheukilonzo@gmail.com"
          git add README.md src/data/stack.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Update languages and tools from GitHub"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
