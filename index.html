<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Katheu Kilonzo — Mind Interface">
<meta property="og:description" content="A terminal-style portfolio for software engineering, psychology-informed product thinking, and systems work.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://images.unsplash.com/photo-1515879218367-8466d910aaa4?auto=format&fit=crop&w=1200&q=80">
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/github.svg">
<title>Katheu — Mind Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz@1,8..60&display=swap');

  :root {
    --bg: #0a0e0e;
    --bg-raised: #0e1414;
    --fg: #d8e3e0;
    --fg-dim: #5b6b6a;
    --accent: #5eead4;
    --accent-dim: #2f6b62;
    --accent2: #8ca9ff;
    --warn: #f2a65a;
    --line: #1c2626;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Source Serif 4', serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(94,234,212,0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(140,169,255,0.04), transparent 45%);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* status bar */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--fg-dim);
    flex-shrink: 0;
  }
  .statusbar .left { display: flex; align-items: center; gap: 8px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .navlinks, .mobile-nav { display: flex; gap: 14px; flex-wrap: wrap; }
  .navlinks button, .mobile-nav button {
    background: none; border: 1px solid var(--line); color: var(--fg-dim);
    font-family: var(--mono); font-size: 11px; padding: 4px 10px;
    border-radius: 3px; cursor: pointer; letter-spacing: 0.04em;
    transition: all 0.15s ease;
  }
  .navlinks button:hover, .mobile-nav button:hover { color: var(--accent); border-color: var(--accent-dim); }
  .mobile-nav { display: none; }

  /* terminal */
  .terminal {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px 12px;
    scroll-behavior: smooth;
  }
  .terminal::-webkit-scrollbar { width: 8px; }
  .terminal::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 14px; }
  .prompt-line { display: flex; gap: 8px; }
  .prompt-sym { color: var(--accent); flex-shrink: 0; }
  .user-input { color: var(--fg); }
  .output {
    color: var(--fg);
    margin: 2px 0 14px 0;
    white-space: pre-wrap;
  }
  .dim { color: var(--fg-dim); }
  .accent { color: var(--accent); }
  .accent2 { color: var(--accent2); }
  .warn { color: var(--warn); }
  .note {
    font-family: var(--serif);
    font-style: italic;
    color: var(--fg-dim);
    font-size: 13px;
    border-left: 2px solid var(--accent-dim);
    padding-left: 10px;
    margin: 6px 0 14px 0;
    white-space: pre-wrap;
  }

  .boot { margin-bottom: 18px; }
  .boot .title { color: var(--accent); font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }

  /* input row */
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px 18px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .input-row .prompt-sym { font-size: 14px; }
  .input-row input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    caret-color: var(--accent);
  }
  .input-row input::placeholder { color: var(--fg-dim); opacity: 0.6; }
  .tab-hint {
    font-size: 11px;
    color: var(--fg-dim);
    margin-left: 8px;
    letter-spacing: 0.04em;
  }

  .suggestions {
    position: relative;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: rgba(14, 20, 20, 0.78);
    border-radius: 6px;
    max-width: 420px;
    display: none;
  }

  .suggestions.visible { display: block; }
  .suggestion-row {
    font-size: 12px;
    color: var(--fg-dim);
    padding: 4px 0;
    cursor: pointer;
    letter-spacing: 0.02em;
    border-radius: 4px;
  }
  .suggestion-row.selected {
    background: rgba(94, 234, 212, 0.08);
    color: var(--accent);
  }
  .suggestion-row strong { color: var(--accent); }
  .suggestion-row:hover { color: var(--accent); }

  .help-list {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  .help-list li {
    margin: 6px 0;
    line-height: 1.6;
  }
  .help-list .cmd {
    color: var(--accent);
    font-weight: 700;
  }
  .help-list .desc {
    color: var(--fg);
  }

  .cursor-blink {
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }

  a.linklike { color: var(--accent2); text-decoration: underline; text-underline-offset: 2px; }

  @media (max-width: 640px) {
    .navlinks { display: none; }
    .mobile-nav {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      padding: 10px 14px 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .input-row {
      padding-left: 14px;
      padding-right: 14px;
    }
    .terminal { padding: 16px 14px 8px; }
    .line, .output { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="statusbar">
  <div class="left"><span class="dot"></span> mind-interface v2.0 — connection established</div>
  <div class="navlinks">
    <button data-cmd="about">about</button>
    <button data-cmd="projects">projects</button>

<div class="mobile-nav">

</div>

<div class="terminal" id="terminal"></div>

<div class="input-row">
  <span class="prompt-sym">&gt;</span>
  <input id="cmdInput" type="text" autofocus autocomplete="off" spellcheck="false" placeholder="type help" />
  <span class="tab-hint">Tab</span>
</div>
<div class="suggestions" id="suggestions"></div>

<script>
const term = document.getElementById('terminal');
const input = document.getElementById('cmdInput');
const suggestionsBox = document.getElementById('suggestions');
let mode = null;
let commandHistory = [];
let historyIndex = null;
let activeSuggestionIndex = -1;

function hideSuggestions() {
  suggestionsBox.classList.remove('visible');
  suggestionsBox.innerHTML = '';
  activeSuggestionIndex = -1;
}

function scrollDown() { term.scrollTop = term.scrollHeight; }

function printRaw(html, cls = 'output') {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  term.appendChild(div);
  scrollDown();
}

function printEcho(cmd) {
  const div = document.createElement('div');
  div.className = 'prompt-line line';
  div.innerHTML = `<span class="prompt-sym">&gt;</span><span class="user-input">${escapeHtml(cmd)}</span>`;
  term.appendChild(div);
  scrollDown();
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const commandList = [
  'help','about','projects','skills','experience','resume','contact','mood','whoami',
  'psychology','thinking','ls','pwd','date','uname','fortune','history','clear',
  'cd ..','cd projects','cd notes','cd research','cd moodforecast-ai','cd mindconnect','cd chema-backend',
  'sudo hire-me','coffee','cat','neofetch','git status','git log','top','whois'
];

const topLevelDirs = ['projects','notes','research','moodforecast-ai','mindconnect','chema-backend','learning-lab'];

function visibleDirectoryNames() {
  if (currentDir === 'home') return topLevelDirs;
  return (systemDirs[currentDir] || []).map(([name]) => name);
}

function getPathCandidates(prefix) {
  const trimmed = String(prefix || '').trim();
  if (!trimmed) return visibleDirectoryNames().slice(0, 8);

  const normalized = trimmed.replace(/^\./, '').replace(/\/$/, '').toLowerCase();
  return visibleDirectoryNames().filter(name => name.toLowerCase().startsWith(normalized) || name.toLowerCase().includes(normalized)).slice(0, 8);
}

function getDynamicSuggestions(query) {
  const text = String(query || '').trim();
  if (!text) return [];

  const match = text.match(/^([a-zA-Z]+)\s*(.*)$/);
  if (!match) return [];

  const command = match[1].toLowerCase();
  const rest = (match[2] || '').trim();

  if ((command === 'ls' || command === 'cd') && rest) {
    const options = getPathCandidates(rest).map(value => `${command} ${value}`);
    return options.length ? options : [`${command} ${rest}`];
  }

  return [];
}

function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    hideSuggestions();
    return;
  }

  const dynamic = getDynamicSuggestions(query);
  let matches = dynamic.length ? dynamic : commandList.filter(cmd => cmd.toLowerCase().includes(q)).slice(0, 6);

  if (!matches.length) {
    hideSuggestions();
    return;
  }

  if (activeSuggestionIndex < 0 || activeSuggestionIndex >= matches.length) {
    activeSuggestionIndex = 0;
  }

  suggestionsBox.innerHTML = matches.map((cmd, index) => {
    const value = String(cmd).toLowerCase();
    const loweredQuery = q.toLowerCase();
    const highlightStart = value.indexOf(loweredQuery);
    const highlighted = highlightStart >= 0
      ? `${escapeHtml(cmd.slice(0, highlightStart))}<strong>${escapeHtml(cmd.slice(highlightStart, highlightStart + q.length))}</strong>${escapeHtml(cmd.slice(highlightStart + q.length))}`
      : escapeHtml(cmd);
    const selectedClass = index === activeSuggestionIndex ? ' selected' : '';
    return `<div class="suggestion-row${selectedClass}" data-cmd="${escapeHtml(cmd)}">${highlighted}</div>`;
  }).join('');
  suggestionsBox.classList.add('visible');

  suggestionsBox.querySelectorAll('.suggestion-row').forEach(row => {
    row.addEventListener('click', () => {
      input.value = row.dataset.cmd;
      hideSuggestions();
      runCommand(row.dataset.cmd);
      input.value = '';
      input.focus();
    });
  });
}

function acceptVisibleSuggestion() {
  const rows = [...suggestionsBox.querySelectorAll('.suggestion-row')];
  if (!rows.length) {
    completeCommand();
    return;
  }

  activeSuggestionIndex = (activeSuggestionIndex + 1) % rows.length;
  const selected = rows[activeSuggestionIndex];
  input.value = selected.dataset.cmd;
  showSuggestions(input.value);
}

const systemDirs = {
  home: [
    ['projects', 'active product, backend, and experimentation work'],
    ['notes', 'learning notes, experiments, and curious ideas'],
    ['research', 'psychology, product, and systems thinking notes']
  ],
  projects: [
    ['moodforecast-ai', 'AI weather-to-wellbeing forecasting experience'],
    ['mindconnect', 'human-centered digital support and wellbeing concepts'],
    ['chema-backend', 'agricultural data and decision-support systems'],
    ['learning-lab', 'small experiments and practical prototypes']
  ],
  notes: [
    ['systems-thinking', 'patterns, design observations, and product notes'],
    ['build-journal', 'ideas and lessons from shipping work'],
    ['mindset', 'psychology and behaviour reflections']
  ],
  research: [
    ['wellbeing', 'mood, context, and human behaviour observations'],
    ['ux', 'friction, trust, and product behavior notes'],
    ['education', 'teaching, learning, and human-centered systems']
  ],
  'moodforecast-ai': [
    ['backend', 'FastAPI services and weather integration'],
    ['data', 'signals, context, and mood scoring logic'],
    ['frontend', 'user-facing visual summaries and dashboards']
  ],
  mindconnect: [
    ['product', 'user journeys and digital care experience flows'],
    ['research', 'supporting material and implementation notes'],
    ['prototype', 'early product concepts and interaction ideas']
  ],
  'chema-backend': [
    ['api', 'core endpoints and orchestration services'],
    ['analytics', 'decision-support and reporting logic'],
    ['integration', 'data pipelines and operational tooling']
  ],
  'learning-lab': [
    ['experiments', 'micro-prototypes and technical tests'],
    ['notes', 'lessons from building and iterating'],
    ['playground', 'curiosity-driven ideas and shell experiments']
  ]
};

const directoryParents = {
  home: null,
  projects: 'home',
  notes: 'home',
  research: 'home',
  'moodforecast-ai': 'projects',
  mindconnect: 'projects',
  'chema-backend': 'projects',
  'learning-lab': 'projects',
  'systems-thinking': 'notes',
  'build-journal': 'notes',
  mindset: 'notes',
  wellbeing: 'research',
  ux: 'research',
  education: 'research',
  backend: 'moodforecast-ai',
  data: 'moodforecast-ai',
  frontend: 'moodforecast-ai',
  product: 'mindconnect',
  prototype: 'mindconnect',
  api: 'chema-backend',
  analytics: 'chema-backend',
  integration: 'chema-backend',
  experiments: 'learning-lab',
  playground: 'learning-lab'
};

let currentDir = 'home';

function normalizeTarget(value) {
  return String(value || '').trim().replace(/^\.\//, '').replace(/\/$/, '').replace(/^\//, '').toLowerCase();
}

function resolveDirectory(target, allowParent = false) {
  const normalized = normalizeTarget(target || 'home');
  if (!normalized || normalized === '.' || normalized === 'home') return 'home';
  if (normalized === '..') return allowParent ? (directoryParents[currentDir] || 'home') : null;

  if (systemDirs[normalized]) return normalized;

  const childMatches = (systemDirs[currentDir] || []).map(([name]) => name).includes(normalized);
  if (childMatches) return normalized;

  return null;
}

function currentPath() {
  const pathParts = [];
  let cursor = currentDir;
  while (cursor && cursor !== 'home') {
    pathParts.unshift(cursor);
    cursor = directoryParents[cursor] || null;
  }
  return pathParts.length ? `/home/katheu/mind-interface/${pathParts.join('/')}` : '/home/katheu/mind-interface';
}

function renderDirectorySummary(dirName, entries) {
  if (!entries || !entries.length) {
    printRaw(`<span class="dim">${dirName}/</span>\n<span class="warn">empty directory. the universe is calm for now.</span>`);
    return;
  }

  const rows = entries.map(([name, detail]) => `  ${name}/  ${detail}`).join('\n');
  printRaw(`<span class="accent">${dirName}/</span>\n${rows}`);
}

function handleLs(raw) {
  const inputArgs = raw.replace(/^ls\s*/i, '').trim();
  const target = inputArgs ? resolveDirectory(inputArgs, inputArgs === '..') : currentDir;

  if (inputArgs === '..' && currentDir === 'home') {
    renderDirectorySummary('home', systemDirs.home);
    return;
  }

  if (!target) {
    printRaw(`<span class="warn">ls: ${escapeHtml(inputArgs || 'home')}: No such directory</span>\n<span class="dim">try "ls projects" or "ls moodforecast-ai".</span>`);
    return;
  }

  renderDirectorySummary(target, systemDirs[target]);
}

function handleCd(raw) {
  const args = raw.replace(/^cd\s*/i, '').trim();

  if (!args) {
    printRaw(`<span class="dim">cd: missing operand</span>\n<span class="dim">try "cd projects" or "cd .." if you enjoy drama.</span>`);
    return;
  }

  if (args === '..') {
    const parent = directoryParents[currentDir] || 'home';

    if (currentDir === 'home') {
      printRaw(`<span class="dim">already at home.</span>\n<span class="dim">current directory: /home/katheu/mind-interface</span>`);
      return;
    }

    currentDir = parent;
    printRaw(`<span class="accent">entered ${parent}/</span>\n<span class="dim">use "ls" to browse around.</span>`);
    return;
  }

  const target = resolveDirectory(args, false);
  if (target) {
    currentDir = target;
    printRaw(`<span class="accent">entered ${target}/</span>\n<span class="dim">use "ls" to browse around.</span>`);
    return;
  }

  printRaw(`<span class="warn">cd: ${escapeHtml(args)}: No such file or directory</span>\n<span class="dim">this path does not exist in this little universe.</span>`);
}

function completeCommand() {
  const partial = input.value.trim();
  if (!partial) return;

  const pathMatch = partial.match(/^([a-zA-Z]+)\s+(.*)$/);
  if (pathMatch) {
    const command = pathMatch[1].toLowerCase();
    const rest = (pathMatch[2] || '').trim();
    if ((command === 'ls' || command === 'cd') && rest) {
      const candidates = getPathCandidates(rest).map(value => `${command} ${value}`);
      if (candidates.length) {
        input.value = candidates[0];
        return;
      }
    }
  }

  const candidates = commandList.filter(cmd => cmd.toLowerCase().startsWith(partial.toLowerCase()));
  if (!candidates.length) return;

  if (candidates.length === 1) {
    input.value = candidates[0];
    return;
  }

  const first = candidates[0];
  let prefix = first;
  for (let i = 1; i < candidates.length; i++) {
    const candidate = candidates[i];
    while (!candidate.toLowerCase().startsWith(prefix.toLowerCase()) && prefix.length > 0) {
      prefix = prefix.slice(0, -1);
    }
    if (!prefix) break;
  }
  input.value = prefix;
}

function unknownCommand(raw) {
  const hints = [
    `unknown command.\n<span class="dim">hint: maybe try "thinking" or "psychology".</span>`,
    `command not found.\n<span class="dim">type "help" if you're lost.</span>`,
    `not recognized yet.\n<span class="dim">this interface rewards curiosity more than precision.</span>`,
    `this command is not in the system.\n<span class="dim">hey, even good explorers need a map sometimes.</span>`,
    `command rejected by the universe.\n<span class="dim">maybe try "fortune" and keep going.</span>`
  ];
  printRaw(hints[Math.floor(Math.random() * hints.length)]);
}

function runCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;

  commandHistory.push(trimmed);
  historyIndex = null;
  printEcho(trimmed);

  if (mode === 'awaiting_whoami') {
    handleWhoamiAnswer(trimmed);
    return;
  }

  const lower = trimmed.toLowerCase();

  if (lower === 'cd ..' || lower.startsWith('cd ')) {
    handleCd(trimmed);
    return;
  }

  if (lower === 'ls' || lower.startsWith('ls ')) {
    handleLs(trimmed);
    return;
  }

  if (commands[lower]) {
    commands[lower]();
    return;
  }

  if (commands[trimmed]) {
    commands[trimmed]();
    return;
  }

  unknownCommand(trimmed);
}

input.addEventListener('input', (e) => {
  showSuggestions(e.target.value);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const partial = input.value.trim();
    if (!partial) {
      printRaw('<span class="dim">tip: press Tab to autocomplete commands and folders like "ls projects" or "cd notes".</span>');
      return;
    }

    if (suggestionsBox.classList.contains('visible')) {
      acceptVisibleSuggestion();
      return;
    }

    const match = partial.match(/^([a-zA-Z]+)\s*(.*)$/);
    if (match) {
      const command = match[1].toLowerCase();
      const rest = (match[2] || '').trim();
      if ((command === 'ls' || command === 'cd') && rest) {
        const options = getPathCandidates(rest);
        if (options.length) {
          input.value = `${command} ${options[0]}`;
          activeSuggestionIndex = 0;
          showSuggestions(input.value);
          return;
        }
      }
    }

    const matches = commandList.filter(cmd => cmd.toLowerCase().startsWith(partial.toLowerCase()));
    if (matches.length) {
      input.value = matches[0];
      activeSuggestionIndex = 0;
      showSuggestions(input.value);
    }
    return;
  }

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!commandHistory.length) return;
    if (historyIndex === null) historyIndex = commandHistory.length;
    historyIndex = Math.max(0, historyIndex - 1);
    input.value = commandHistory[historyIndex];
    showSuggestions('');
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIndex === null) return;
    historyIndex = Math.min(commandHistory.length, historyIndex + 1);
    if (historyIndex >= commandHistory.length) {
      input.value = '';
      historyIndex = null;
    } else {
      input.value = commandHistory[historyIndex];
    }
    showSuggestions('');
    return;
  }

  if (e.key === 'Enter') {
    const val = input.value;
    input.value = '';
    hideSuggestions();
    runCommand(val);
  }
});

document.querySelectorAll('.navlinks button').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.cmd;

    input.value = '';
