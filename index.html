    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <style>
      /* Just enough for the first paint and the no-JavaScript fallback. */
      body {
        margin: 0;
        background: #0a0e0e;
        color: #d8e3e0;
        font-family: ui-monospace, 'Courier New', monospace;
      }
      /* The fallback only appears if the app has not replaced it after 3 seconds. */
      .fallback {
        padding: 24px 22px;
        max-width: 70ch;
        opacity: 0;
        animation: reveal 0s 3s forwards;
      }
      .fallback a {
        color: #8ca9ff;
      }
      @keyframes reveal {
        to {
          opacity: 1;
        }
      }
    </style>
    <noscript>
      <style>
        .fallback {
          opacity: 1;
          animation: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the terminal once the app loads. -->
      <div class="fallback">
        <h1>Katheu Kilonzo</h1>
        <p>Psychologist, backend engineer, and human-centered systems builder.</p>
        <p>
          This portfolio is an interactive terminal and needs JavaScript. Until it loads, you can reach me here:
        </p>
        <p>
          <a href="mailto:fkatheukilonzo@gmail.com">fkatheukilonzo@gmail.com</a> ·
          <a href="https://github.com/KathFK1234">GitHub</a> ·
          <a href="https://www.linkedin.com/in/katheu-kilonzo-1a260422a/">LinkedIn</a>
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
