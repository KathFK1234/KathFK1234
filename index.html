<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katheu — Mind Interface</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Source+Serif+4:ital,opsz@1,8..60&display=swap');

  :root {
    --bg: #0a0e0e;
    --bg-raised: #0e1414;
    --fg: #d8e3e0;
    --fg-dim: #5b6b6a;
    --accent: #5eead4;
    --accent-dim: #2f6b62;
    --accent2: #8ca9ff;
    --warn: #f2a65a;
    --line: #1c2626;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Source Serif 4', serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 8%, rgba(94,234,212,0.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(140,169,255,0.04), transparent 45%);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* status bar */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--fg-dim);
    flex-shrink: 0;
  }
  .statusbar .left { display: flex; align-items: center; gap: 8px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .navlinks { display: flex; gap: 14px; flex-wrap: wrap; }
  .navlinks button {
    background: none; border: 1px solid var(--line); color: var(--fg-dim);
    font-family: var(--mono); font-size: 11px; padding: 4px 10px;
    border-radius: 3px; cursor: pointer; letter-spacing: 0.04em;
    transition: all 0.15s ease;
  }
  .navlinks button:hover { color: var(--accent); border-color: var(--accent-dim); }

  /* terminal */
  .terminal {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px 12px;
    scroll-behavior: smooth;
  }
  .terminal::-webkit-scrollbar { width: 8px; }
  .terminal::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-word; line-height: 1.55; font-size: 14px; }
  .prompt-line { display: flex; gap: 8px; }
  .prompt-sym { color: var(--accent); flex-shrink: 0; }
  .user-input { color: var(--fg); }
  .output { color: var(--fg); margin: 2px 0 14px 0; }
  .dim { color: var(--fg-dim); }
  .accent { color: var(--accent); }
  .accent2 { color: var(--accent2); }
  .warn { color: var(--warn); }
  .note {
    font-family: var(--serif);
    font-style: italic;
    color: var(--fg-dim);
    font-size: 13px;
    border-left: 2px solid var(--accent-dim);
    padding-left: 10px;
    margin: 6px 0 14px 0;
  }

  .boot { margin-bottom: 18px; }
  .boot .title { color: var(--accent); font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }

  /* input row */
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px 18px;
    border-top: 1px solid var(--line);
    flex-shrink: 0;
  }
  .input-row .prompt-sym { font-size: 14px; }
  .input-row input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 14px;
    caret-color: var(--accent);
  }
  .input-row input::placeholder { color: var(--fg-dim); opacity: 0.6; }

  .suggestions {
    position: relative;
    margin-top: 8px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    background: rgba(14, 20, 20, 0.78);
    border-radius: 6px;
    max-width: 420px;
    display: none;
  }

  .suggestions.visible { display: block; }
  .suggestion-row {
    font-size: 12px;
    color: var(--fg-dim);
    padding: 4px 0;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .suggestion-row strong { color: var(--accent); }
  .suggestion-row:hover { color: var(--accent); }

  .help-list {
    list-style: none;
    padding-left: 0;
    margin: 0;
  }
  .help-list li {
    margin: 6px 0;
    line-height: 1.6;
  }
  .help-list .cmd {
    color: var(--accent);
    font-weight: 700;
  }
  .help-list .desc {
    color: var(--fg);
  }

  .cursor-blink {
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }

  a.linklike { color: var(--accent2); text-decoration: underline; text-underline-offset: 2px; }

  @media (max-width: 640px) {
    .navlinks { display: none; }
    .terminal { padding: 16px 14px 8px; }
    .line, .output { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="statusbar">
  <div class="left"><span class="dot"></span> mind-interface v2.0 — connection established</div>
  <div class="navlinks">
    <button data-cmd="about">about</button>
    <button data-cmd="projects">projects</button>
    <button data-cmd="skills">skills</button>
    <button data-cmd="resume">resume</button>
    <button data-cmd="contact">contact</button>
  </div>
</div>

<div class="terminal" id="terminal"></div>

<div class="input-row">
  <span class="prompt-sym">&gt;</span>
  <input id="cmdInput" type="text" autofocus autocomplete="off" spellcheck="false" placeholder="type help to begin" />
</div>
<div class="suggestions" id="suggestions"></div>

<script>
const term = document.getElementById('terminal');
const input = document.getElementById('cmdInput');
const suggestionsBox = document.getElementById('suggestions');
let unlocked = { thinking: false };
let mode = null; // set by whoami
let commandHistory = [];

function scrollDown() { term.scrollTop = term.scrollHeight; }

function printRaw(html, cls = 'output') {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  term.appendChild(div);
  scrollDown();
}

function printEcho(cmd) {
  const div = document.createElement('div');
  div.className = 'prompt-line line';
  div.innerHTML = `<span class="prompt-sym">&gt;</span><span class="user-input">${escapeHtml(cmd)}</span>`;
  term.appendChild(div);
  scrollDown();
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function note(text) { printRaw(text, 'note'); }

const commandList = [
  'help','about','projects','skills','experience','resume','contact','mood','whoami',
  'psychology','thinking','ls','pwd','date','uname','fortune','history','clear',
  'sudo hire-me','coffee','cat','neofetch','git status','git log','top','whois'
];

function showSuggestions(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    suggestionsBox.classList.remove('visible');
    suggestionsBox.innerHTML = '';
    return;
  }

  const matches = commandList.filter(cmd => cmd.toLowerCase().includes(q)).slice(0, 6);
  if (!matches.length) {
    suggestionsBox.classList.remove('visible');
    suggestionsBox.innerHTML = '';
    return;
  }

  suggestionsBox.innerHTML = matches.map(cmd => {
    const highlighted = cmd.toLowerCase().replace(q, `<strong>${q}</strong>`);
    return `<div class="suggestion-row" data-cmd="${cmd}">${highlighted}</div>`;
  }).join('');
  suggestionsBox.classList.add('visible');

  suggestionsBox.querySelectorAll('.suggestion-row').forEach(row => {
    row.addEventListener('click', () => {
      input.value = row.dataset.cmd;
      suggestionsBox.classList.remove('visible');
      suggestionsBox.innerHTML = '';
      runCommand(row.dataset.cmd);
      input.value = '';
      input.focus();
    });
  });
}

const commands = {
  help() {
    const items = [
      ['about', 'who I am and why this exists'],
      ['psychology', 'why psychology shapes how I build software'],
      ['projects', 'case studies and featured work'],
      ['skills', 'stack, tools, and technical strengths'],
      ['experience', 'background and current work'],
      ['resume', 'quick professional summary'],
      ['contact', 'email, GitHub, and LinkedIn'],
      ['thinking', 'the mental model behind my work'],
      ['mood', 'check the live MoodForecast AI service'],
      ['ls', 'list the projects and ideas in this little universe'],
      ['pwd', 'reveal the current working directory'],
      ['date', 'print the current timestamp'],
      ['uname', 'reveal the machine identity'],
      ['fortune', 'a tiny burst of wisdom'],
      ['history', 'show recent terminal commands you explored'],
      ['whoami', 'ask the interface why you are here'],
      ['clear', 'reset the terminal'],
      ['coffee', 'because every serious build needs motivation'],
      ['cat', 'a very important cat'],
      ['sudo hire-me', 'the dramatic hiring path'],
      ['neofetch', 'show a tiny system summary for this strange little universe']
    ];

    const html = `
      <span class="accent">available commands</span>
      <ul class="help-list">
        ${items.map(([cmd, desc]) => `<li><span class="cmd">${cmd}</span> <span class="desc">— ${desc}</span></li>`).join('')}
      </ul>
      <div class="note">This interface is intentionally playful. Try random terminal-like commands and see what the system has to say.</div>
    `;
    printRaw(html);
  },

  about() {

      `Type <span class="accent2">psychology</span> if you want the deeper version.`
    );
  },

  psychology() {
    printRaw(
      `Psychology wasn't a detour. It became the lens through which I look at software.\n\n` +
      `I think in terms of behavior, motivation, friction, trust, and context. Why do people abandon a flow? Why does one system feel intuitive while another feels exhausting? Why do systems fail when they ignore the people using them?\n\n` +
      `That mindset shows up in how I build: cleaner interfaces, clearer APIs, more human-centered design, and more thoughtful product decisions.`
    );
  },

  thinking() {

      `<span class="accent">MindConnect</span> — a mental-health platform designed around youth-centered support and human-centered digital care.\n\n` +

    );
  },

  skills() {
    printRaw(
      `core stack\n\n` +

      `  backend:   <span class="accent2">FastAPI, Django, DRF, REST APIs, PostgreSQL</span>\n` +
      `  cloud:     <span class="accent2">AWS, Docker, Railway, Supabase, DigitalOcean</span>\n` +

  experience() {

  },

  resume() {
    printRaw(
      `short professional summary:\n\n` +
      `  Software Engineer + School Lead Educator\n` +

      `  BA Psychology\n` +

      `  <a class="linklike" href="https://www.linkedin.com/in/katheu-kilonzo-1a260422a/" target="_blank" rel="noreferrer">linkedin profile</a>\n` +
      `  <a class="linklike" href="https://github.com/KathFK1234" target="_blank" rel="noreferrer">github</a>`
    );
  },

  contact() {
    printRaw(
      `reach me directly:\n\n` +
      `  email:     <span class="accent2">fkatheukilonzo@gmail.com</span>\n` +
      `  github:    <span class="accent2">github.com/KathFK1234</span>\n` +
      `  linkedin:  <span class="accent2">linkedin.com/in/katheu-kilonzo-1a260422a</span>\n\n` +
      `or type <span class="accent">sudo hire-me</span> if you want the dramatic path.`

  },

  'sudo hire-me'() {
    printRaw(
      `<span class="dim">[sudo] password for visitor: ********</span>\n` +
      `<span class="accent">access granted.</span> no password required, just interest.\n\n` +
      `email: <span class="accent2">fkatheukilonzo@gmail.com</span>\n` +
      `linkedin: <a class="linklike" href="https://www.linkedin.com/in/katheu-kilonzo-1a260422a/" target="_blank" rel="noreferrer">connect here</a>`

  async mood() {
    printRaw(`<span class="dim">contacting MoodForecast AI service ...</span>`);
    try {
      const res = await fetch('https://moodforecastai-production.up.railway.app/health', { mode: 'cors' });
      if (!res.ok) throw new Error('non-200');
      printRaw(`<span class="accent">connection live.</span> the service responded correctly. This is the kind of system I enjoy building: expressive, useful, and grounded in context.`);
    } catch (e) {
      printRaw(
        `<span class="warn">live connection unavailable from this static preview.</span>\n` +
        `This command is meant to hit your deployed FastAPI endpoint directly. In production, it would return something like:\n\n` +
        `  <span class="accent">wellbeing index: 7.2</span> — partly cloudy, mildly optimistic`
      );
    }
  },

  ls() {
    printRaw(
      `<span class="accent">projects/</span>\n` +
      `  moodforecast-ai/\n` +
      `  mindconnect/\n` +
      `  chema-backend/\n` +
      `  ideas/\n` +
      `  experiments/\n\n` +
      `<span class="dim">nothing is broken. the repo is just ambitious.</span>`
    );
  },

  pwd() {
    printRaw(`/home/katheu/mind-interface`);
  },

  date() {
    const now = new Date();
    printRaw(`<span class="accent">${now.toString()}</span>`);
  },

  uname() {
    printRaw(`Linux katheu-portfolio 6.8.0-52-generic x86_64 GNU/Linux`);
  },

  fortune() {
    const lines = [
      '“Build things that make life feel simpler, not just more technical.”',
      '“The best systems are the ones people trust enough to keep using.”',
      '“Curiosity is a better deployment strategy than perfection.”',
      '“A product that understands context will always beat a product that only computes.”',
      '“Even a system with a perfectly tuned API still needs a little human sense.”',
      '“The most useful code is often the kind that makes another person feel less stuck.”'
    ];
    printRaw(`<span class="accent2">${lines[Math.floor(Math.random() * lines.length)]}</span>`);
  },

  history() {
    if (!commandHistory.length) {
      printRaw(`<span class="dim">history is empty. try a command and come back. bravery is a habit.</span>`);
      return;
    }

    const html = `
      <span class="accent">command history</span>
      <ul class="help-list">
        ${commandHistory.slice().reverse().map(entry => `<li><span class="cmd">${escapeHtml(entry)}</span></li>`).join('')}
      </ul>
    `;
    printRaw(html);
  },

  neofetch() {
    printRaw(
      `<span class="accent">katheu@mind-interface</span>\n` +
      `-------------------------------\n` +
      `OS:   human-centered software\n` +
      `Host: build-with-purpose\n` +
      `Kernel: curiosity 1.0\n` +
      `Uptime: forever curious\n` +
      `Shell: terminal-of-thoughts\n` +
      `Theme: psychology + product + code`
    );
  },

  clear() {
    term.innerHTML = '';
    boot();
  },

  coffee() {
    printRaw(`<span class="warn">Error: coffee not found.</span>\nMotivation module compensating with stubborn optimism.`);
  },

  cat() {
    printRaw(`\n(=^.^=)\n  /| |\\\n  / |_| \\`);
  },

  'git status'() {
    printRaw(
      `<span class="accent">On branch main</span>\n` +
      `Your branch is feeling optimistic.\n` +
      `Changes not staged for commit: 1\n` +

    );

  'git log'() {

  top() {
    printRaw(
      `<span class="accent">top</span>\n` +

      `1234 katheu  20  0  65m  9m  4m S   4.1  0.2 node\n` +
      `5204 katheu  20  0  35m  7m  3m S   2.8  0.1 python\n` +
      `<span class="dim">status: thinking deeply and shipping carefully</span>`
    );
  },

  whois() {
    printRaw(
      `<span class="accent">WHOIS katheu</span>\n` +
      `Name: Katheu Kilonzo\n` +
      `Role: software engineer, educator, systems thinker\n` +
      `Interests: psychology, AI, backend systems, product design\n` +
      `Verdict: interesting enough to keep investigating`
    );
  },

  whoami() {
    printRaw(
      `<span class="dim">visitor profile scan started...</span>\n\n` +
      `what brings you here?\n\n` +
      `  1. hiring\n  2. collaborating\n  3. just exploring`
    );
    mode = 'awaiting_whoami';
  }
};

function handleWhoamiAnswer(raw) {
  const t = raw.trim().toLowerCase();
  mode = null;

  if (t === '1' || t.includes('hir')) {
    printRaw(`noted. try <span class="accent">resume</span> or <span class="accent">projects</span> — those will tell the quicker story.`);
  } else if (t === '2' || t.includes('collab')) {
    printRaw(`good. try <span class="accent">projects</span> then <span class="accent">contact</span> — I’m always interested in meaningful overlap.`);
  } else {
    printRaw(`fair enough. type <span class="accent">psychology</span> or <span class="accent">thinking</span> if you want the deeper version of the story.`);
  }
}

function unknownCommand(raw) {
  const hints = [
    `unknown command.\n<span class="dim">hint: maybe try "thinking" or "psychology".</span>`,
    `command not found.\n<span class="dim">type "help" if you're lost.</span>`,
    `not recognized yet.\n<span class="dim">this interface rewards curiosity more than precision.</span>`
  ];
  printRaw(hints[Math.floor(Math.random() * hints.length)]);
}

function runCommand(raw) {
  const trimmed = raw.trim();
  if (!trimmed) return;

  commandHistory.push(trimmed);
  printEcho(trimmed);

  if (mode === 'awaiting_whoami') {
    handleWhoamiAnswer(trimmed);
    return;
  }

  const key = trimmed.toLowerCase();

  if (commands[key]) {
    commands[key]();
  } else if (commands[trimmed]) {
    commands[trimmed]();
  } else if (key === '') {
    // no-op
  } else {
    unknownCommand(trimmed);
  }
}

input.addEventListener('input', (e) => {
  showSuggestions(e.target.value);
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const val = input.value;
    input.value = '';
    suggestionsBox.classList.remove('visible');
    suggestionsBox.innerHTML = '';
    runCommand(val);
  }
});

document.querySelectorAll('.navlinks button').forEach(btn => {
  btn.addEventListener('click', () => {
    input.value = btn.dataset.cmd;
    runCommand(btn.dataset.cmd);
    input.value = '';
    suggestionsBox.classList.remove('visible');
    suggestionsBox.innerHTML = '';
    input.focus();
  });
});

document.addEventListener('click', () => input.focus());

function boot() {
  printRaw(
    `<div class="boot"><span class="title">MIND INTERFACE v2.0</span></div>` +
    `connection established.\n\nwho are you looking for?\n\n` +
    `<span class="dim">type</span> <span class="accent">help</span> <span class="dim">to explore the system.</span>`
  );
}

boot();
</script>

</body>
</html>
